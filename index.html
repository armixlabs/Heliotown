<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Heliotown</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='26' r='14' fill='%23ffc107'/%3E%3Crect x='8' y='38' width='12' height='22' fill='%233a8ef0'/%3E%3Crect x='24' y='30' width='14' height='30' fill='%23607d8b'/%3E%3Crect x='42' y='42' width='14' height='18' fill='%233fbf5a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <header id="topbar" class="hidden">
    <button id="btnMenu" class="tb" data-i18n-title="tb.menu">☰</button>
    <div class="brand"><span class="sun">☀️</span><span id="cityName">Heliotown</span><small id="cityClass"></small></div>
    <div class="stat" id="statDate" data-i18n-title="tb.date"></div>
    <div class="stat" id="statMoney" data-i18n-title="tb.money"></div>
    <div class="stat" id="statPop" data-i18n-title="tb.pop"></div>
    <div class="stat" id="statPower" data-i18n-title="tb.power"></div>
    <div id="rci" data-i18n-title="tb.rci">
      <div class="bar" data-z="r"><i></i><b data-i18n="rci.r">W</b></div>
      <div class="bar" data-z="c"><i></i><b data-i18n="rci.c">G</b></div>
      <div class="bar" data-z="i"><i></i><b data-i18n="rci.i">I</b></div>
    </div>
    <div id="speed">
      <button data-speed="0" data-i18n-title="tb.pause">⏸</button>
      <button data-speed="1" data-i18n-title="tb.slow">▶</button>
      <button data-speed="2" data-i18n-title="tb.normal">▶▶</button>
      <button data-speed="3" data-i18n-title="tb.fast">▶▶▶</button>
    </div>
    <div class="spacer"></div>
    <button id="btnRotL" class="tb" data-i18n-title="tb.rotL">⟲</button>
    <button id="btnRotR" class="tb" data-i18n-title="tb.rotR">⟳</button>
    <button id="btnView" class="tb">🗺️ <span class="t">2D</span></button>
    <button id="btnBudget" class="tb">💰 <span class="t" data-i18n="tb.budget">Haushalt</span></button>
    <button id="btnStats" class="tb">📈 <span class="t" data-i18n="tb.stats">Statistik</span></button>
    <button id="btnSave" class="tb">💾 <span class="t" data-i18n="tb.save">Speichern</span></button>
    <button id="btnHelp" class="tb" data-i18n-title="tb.help">❓</button>
  </header>

  <nav id="toolbar" class="hidden"></nav>

  <aside id="side" class="hidden">
    <canvas id="minimap" width="200" height="200" data-i18n-title="side.minimap"></canvas>
    <div class="sidehead" data-i18n="side.view">Ansicht</div>
    <div id="overlays"></div>
    <div id="legend"></div>
  </aside>

  <div id="infoPanel" class="hidden"></div>
  <div id="ticker" class="hidden" data-i18n-title="ticker.title"></div>
  <div id="toasts"></div>
  <div id="cursorTip" class="hidden"></div>

  <div id="modal" class="hidden"><div id="dialog"></div></div>
  <input type="file" id="fileInput" accept=".json,application/json" class="hidden">

  <noscript><p style="color:#fff;padding:2em">Heliotown benötigt JavaScript. / Heliotown requires JavaScript.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/render.js"></script>
  <script src="js/render3d.js"></script>
  <script src="js/ui.js"></script>
  <script>SC.Game.init();</script>
</body>
</html>
